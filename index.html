<title>JLPT(單字)</title>
<style>
:root{--bg:#F5F8F7;--card:#fff;--ink:#1E2B29;--soft:#4C5E5B;--line:#DAE4E1;--g:#2A8C80;--gd:#1F6F65;--gt:#E3F2EF;--b:#37678A;--a:#B7791F;--r:#B5483A}
@media(prefers-color-scheme:dark){:root{--bg:#121917;--card:#1B2523;--ink:#E6EEEC;--soft:#9DB0AC;--line:#2C3B38;--gt:#1F3531;--g:#4FB3A5}}
*{box-sizing:border-box}html{-webkit-tap-highlight-color:transparent}input,select{font-size:16px}header{padding-top:env(safe-area-inset-top)}main{padding-bottom:calc(24px + env(safe-area-inset-bottom))}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.m{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav{display:flex;gap:4px;max-width:880px;margin:auto;padding:8px;overflow-x:auto}
nav b{padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--soft);font-weight:500}nav b.on{background:var(--gt);color:var(--gd)}
main{max-width:880px;margin:auto;padding:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px}.big{font-size:44px;line-height:1.1}.sm{color:var(--soft);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
input[type=text],input:not([type]),select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row input{flex:1;min-width:140px}
.li{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}.li:hover{background:var(--gt)}
.li .w{font-size:22px;min-width:110px}.li .t{flex:1}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--soft)}.tag.long{background:var(--gt);color:var(--gd)}.tag.short{color:var(--b)}.tag.learning{color:var(--a)}.chip{cursor:pointer;font-size:15px;padding:2px 9px}summary{padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.k{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 6px;text-align:center;cursor:pointer}.k:hover{background:var(--gt)}.k .m{font-size:42px;line-height:1.1}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(620px,94vw);max-height:88vh;padding:20px}dialog::backdrop{background:#0006}
ruby rt{font-size:.55em;color:var(--soft)}.nofu rt{display:none}
.ex{background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:8px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}.opt:hover{background:var(--gt)}.ok{background:var(--gt)!important;border-color:var(--g)!important}.no{border-color:var(--r)!important;color:var(--r)}
.wk{display:flex;gap:8px;align-items:flex-end;height:110px}.wk div{flex:1;text-align:center;font-size:12px;color:var(--soft)}.wk i{display:block;background:var(--g);border-radius:4px 4px 0 0;min-height:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px;margin-top:12px}.stats b{display:block;font-size:20px}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:9px;display:none;z-index:9}
@media(max-width:480px){nav{gap:2px;padding:8px 4px}nav b{padding:8px 9px;font-size:14px}}</style></head><body>

<script>
const V=[{"i":0,"l":"N5","w":"会う","r":"あう","ro":"au","m":"見面、遇見","e":"to meet","p":"五段動詞","x":[["もうスミスさんに{会|あ}われましたね。","You've met Mr. Smith already, haven't you?"],["じゃあパーティーで{会|あ}いましょう。","See you at the party."]]},{"i":1,"l":"N5","w":"青","r":"あお","ro":"ao","m":"藍色、青色","e":"blue","p":"名詞・の形容詞","x":[["{信号|しんごう}が{青|あお}に{変|か}わったわよ。","The traffic light turned green."],["夏の通学服は白と青のチェックです。","My summer school dress is blue and white checkered."]]},{"i":2,"l":"N5","w":"青い","r":"あおい","ro":"aoi","m":"藍色的","e":"blue","p":"い形容詞","x":[["お{前|まえ}はまだ「{青|あお}い」な。","You're still green."],["なぜ{空|そら}が{青|あお}いか{知|し}っているか。","Do you know why the sky is blue?"]]},{"i":3,"l":"N5","w":"赤","r":"あか","ro":"aka","m":"紅色","e":"red","p":"名詞・の形容詞","x":[["{赤|あか}インクで{書|か}いてはいけない。","Don't write in red ink."],["その{家|いえ}は{赤|あか}レンガづくりです。","The house is built of red bricks."]]},{"i":4,"l":"N5","w":"赤い","r":"あかい","ro":"akai","m":"紅色的","e":"red","p":"い形容詞","x":[["{彼女|かのじょ}は{赤|あか}いスカートをはいていた。","She was wearing a red skirt."],["{赤|あか}いものもあれば{白|しろ}いのもある。","Some are red and others are white."]]},{"i":5,"l":"N5","w":"明るい","r":"あかるい","ro":"akarui","m":"明亮的","e":"bright","p":"い形容詞","x":[["{外|そと}はだんだん{明|あか}るくなっていく。","It is getting lighter outside."],["ダイヤは{明|あか}るく{光|ひか}った。","The diamond shone brightly."]]},{"i":6,"l":"N5","w":"秋","r":"あき","ro":"aki","m":"秋天","e":"autumn","p":"名詞・副詞","x":[["{秋|あき}はもうすぐそこまで{来|き}ている。","Autumn is just around the corner."],["さわやかな{秋|あき}となりました。","Cool fall is here."]]},{"i":7,"l":"N5","w":"開く","r":"あく","ro":"aku","m":"開、打開（自動詞）","e":"to open; to become open","p":"五段動詞","x":[["ぐいと{押|お}すとドアは{開|あ}いた。","The door yielded to a strong push."],["ドアはどうしても{開|あ}かなかった。","The door would not open."]]},{"i":8,"l":"N5","w":"開ける","r":"あける","ro":"akeru","m":"打開（他動詞）","e":"to open","p":"一段動詞","x":[["ドアはジムによって{開|あ}けられます。","The door is opened by Jim."],["だれかこのドアを{開|あ}けてください。","Somebody, open this door, please."]]},{"i":9,"l":"N5","w":"上げる","r":"あげる","ro":"ageru","m":"給、送給","e":"to give","p":"一段動詞","x":[["{左手|ひだりて}を{上|あ}げなさい。","Raise your left hand."],["{彼|かれ}はスピードを{上|あ}げた。","He accelerated."]]},{"i":10,"l":"N5","w":"朝","r":"あさ","ro":"asa","m":"早上","e":"morning","p":"名詞・副詞","x":[["{朝|あさ}のラッシュは{今|いま}がピークだ。","The morning rush is at its peak now."],["ジョージは{朝|あさ}にたくさんのチーズを{食|た}べた。","George had a lot of cheese for breakfast."]]},{"i":11,"l":"N5","w":"朝ごはん","r":"あさごはん","ro":"asagohan","m":"早餐","e":"breakfast","p":"名詞","x":[["朝ごはんにはなにがよろしいですか。","What would you like for breakfast?"],["{朝|あさ}ご{飯|はん}に{何|なに}を{食|た}べますか。","What do you usually have for breakfast?"]]},{"i":12,"l":"N5","w":"あさって","r":"あさって","ro":"asatte","m":"後天","e":"day after tomorrow","p":"名詞・副詞","x":[["あさって{彼|かれ}にここへ{来|き}てもらうつもりです。","I will have him come here the day after tomorrow."],["あさって、{時間|じかん}がありませんか。","Do you have time the day after tomorrow?"]]},{"i":13,"l":"N5","w":"足","r":"あし","ro":"ashi","m":"腳、腿","e":"foot; leg","p":"名詞","x":[["また{足|あし}がしびれた。","My foot's asleep again!"],["ヘビを{見|み}て{足|あし}がすくんでしまった。","I froze at the sight of the snake."]]},{"i":14,"l":"N5","w":"明日","r":"あした","ro":"ashita","m":"明天","e":"tomorrow","p":"名詞・副詞","x":[["あしたは{一日中|いちにちじゅう}ひまです。","I'll be free all day tomorrow."],["明日はピクニックに行くつもりだ。","I am going on a picnic tomorrow."]]},{"i":15,"l":"N5","w":"あそこ","r":"あそこ","ro":"asoko","m":"那裡（離說話者與聽者都遠）","e":"over there","p":"代名詞","x":[["{先生|せんせい}、アソコがかゆいんです。","Doctor, I've got an itch in my crotch."],["あそこのスポーツカーを{見|み}なさい。","Look at the sports car over there."]]},{"i":16,"l":"N5","w":"遊ぶ","r":"あそぶ","ro":"asobu","m":"玩、遊玩","e":"to play; to make a visit","p":"五段動詞","x":[["ビルはよく{一人|ひとり}でおもちゃで{遊|あそ}ぶ。","Bill often plays with toys by himself."],["けっしてここで{遊|あそ}んではいけない。","Never play here."]]},{"i":17,"l":"N5","w":"暖かい","r":"あたたかい","ro":"atatakai","m":"溫暖的","e":"warm","p":"い形容詞","x":[["だんだん{暖|あたた}かくなります。","It will get warmer and warmer."],["{日毎|ひごと}にだんだん{暖|あたた}かくなっている。","It is getting warmer and warmer day by day."]]},{"i":18,"l":"N5","w":"頭","r":"あたま","ro":"atama","m":"頭","e":"head","p":"名詞","x":[["アリスは{頭|あたま}に{花|はな}をさしています。","Alice has a flower in her hair."],["ジルはかわいいだけでなく{頭|あたま}もよい。","Jill is smart as well as pretty."]]},{"i":19,"l":"N5","w":"新しい","r":"あたらしい","ro":"atarashii","m":"新的","e":"new","p":"い形容詞","x":[["{先生|せんせい}は{新|あたら}しい{車|くるま}が{気|き}に{入|い}っている。","Our teacher likes his new car."],["{新|あたら}しいレストランが{出来|でき}たそうだ。","It is said that a new restaurant was constructed."]]},{"i":20,"l":"N5","w":"あちら","r":"あちら","ro":"achira","m":"那邊、那位（較有禮貌）","e":"there","p":"代名詞","x":[["こっちの{本|ほん}はあっちの{本|ほん}よりやさしい。","These books are easier than those books."],["あちらに{着|つ}いたら{手紙|てがみ}をください。","Please write to me when you get there."]]},{"i":21,"l":"N5","w":"厚い","r":"あつい","ro":"atsui","m":"厚的、深厚的","e":"kind; deep; thick","p":"い形容詞","x":[["それは４ｃｍの{厚|あつ}さです。","It is four centimeters thick."],["{氷|こおり}は２インチの{厚|あつ}さだ。","The ice is two inches thick."]]},{"i":22,"l":"N5","w":"暑い","r":"あつい","ro":"atsui","m":"熱的（天氣）","e":"hot","p":"い形容詞","x":[["どうして、こんなに{暑|あつ}いのですか。","Why is it so hot?"],["{暑|あつ}くならないうちに{出|で}かけよう。","Let's go out before it gets hot."]]},{"i":23,"l":"N5","w":"熱い","r":"あつい","ro":"atsui","m":"燙的、熱的（觸感）","e":"hot to the touch","p":"い形容詞","x":[["{熱|あつ}いコーヒーを{入|い}れてあげましょう。","Let me make you a cup of hot coffee."],["{熱|あつ}いダックスフント・ソーセージはいかが。","Get your hot dachshund sausages!"]]},{"i":24,"l":"N5","w":"あっち","r":"あっち","ro":"atchi","m":"那邊（口語）","e":"over there","p":"代名詞","x":[["こっちの{本|ほん}はあっちの{本|ほん}よりやさしい。","These books are easier than those books."],["あっちにエレベーターがあるみたいだよ。","It looks like there's an elevator over there."]]},{"i":25,"l":"N5","w":"後","r":"あと","ro":"ato","m":"之後、後面","e":"afterwards","p":"名詞・の形容詞","x":[["{雨天|うてん}の{後|あと}には{晴天|せいてん}が{来|く}る。","After rain comes fair weather."],["アルファベットでＢはＡの{後|あと}にくる。","In the alphabet, B comes after A."]]},{"i":26,"l":"N5","w":"あなた","r":"あなた","ro":"anata","m":"你","e":"you","p":"代名詞","x":[["ねえあなたたち行かないで。","Don't go, dears."],["どちらの{本|ほん}があなたのものですか。","Which book is yours?"]]},{"i":27,"l":"N5","w":"兄","r":"あに","ro":"ani","m":"哥哥（對外稱自己的哥哥）","e":  for(const t of['v','k']){const ids=plan(t),L=A(t),un=ids.filter(i=>!S[t][i]),st=ids.length-un.length,ps=ids.filter(i=>S[t][i]?.ld==today()).length,q=queue(t,'today').length,rv=queue(t,'review').length;

 <div class="row" style="margin-top:12px"><button class="btn" ${ids.length?'':'disabled'} onclick="startStudy('${t}',${un.length?0:1})">${un.length?`開始學習（剩 ${un.length} 個）`:'再看一遍'}</button><button class="btn" ${un.length||!q?'disabled':''} onclick="startQuiz('${t}','today')">開始測驗${q?`（${q} 題）`:''}</button>${rv?`<button class="btn o" onclick="startQuiz('${t}','review')">到期複習（${rv} 題）</button>`:''}</div>
 <p class="sm">${!ids.length?'沒有新的內容可以學了！':un.length?'先完成學習，才能開始測驗。':q?'':'今天的測驗都通過了。'}</p>
 <details><summary class="sm" style="cursor:pointer">今日內容（${ids.length}）</summary><div class="row" style="margin-top:8px">${ids.map(i=>`<span class="tag chip ${S[t][i]?.s||''}" onclick="show('${t}',${i})">${esc(nm(t,L[i]))}</span>`).join('')}</div></details></div>`}
 save();$('#app').innerHTML=h}
function startStudy(t,again){const ids=plan(t).filter(i=>again||!S[t][i]);if(!ids.length)return;ST={t,ids,n:0,rev:0};tab='today';navr();studyView()}
function studyView(){const{t,ids,n,rev}=ST,x=A(t)[ids[n]];
 $('#app').innerHTML=`<div class="c"><p class="sm">${t=='v'?'單字':'漢字'}學習　${n+1} / ${ids.length}</p>${head(t,x)}${rev?info(t,x)+`<div class="row" style="margin-top:14px"><button class="btn" onclick="nextCard()">${n+1>=ids.length?'完成學習':'下一個'}</button></div>`:`<p class="sm">先想想它的意思，再按「顯示答案」。</p><button class="btn" onclick="ST.rev=1;studyView()">顯示答案</button>`}<div class="row" style="margin-top:14px"><button class="btn o" onclick="go('today')">先離開</button></div></div>`}
function nextCard(){const{t,ids,n}=ST,id=ids[n];if(!S[t][id]){S[t][id]={s:'learning',c:0,w:0,m:[],mk:0};S.log.push([today(),'v',1]);save()}
 if(n+1>=ids.length){toast('學習完成！可以開始測驗了');return go('today')}ST.n++;ST.rev=0;studyView()}
function startQuiz(t,kind){const ids=sh(queue(t,kind));if(!ids.length)return toast('沒有需要測驗的項目');Q={t,kind,queue:ids,total:ids.length,ok:0,tried:new Set()};tab=kind=='mist'?'mist':'today';navr();nextQ()}
function nextQ(){if(!Q.queue.length)return endQuiz();const t=Q.t,id=Q.queue.shift(),x=A(t)[id],it=S[t][id],kj=t=='k',
 modes=kj?['ja_to_zh','zh_to_ja','kanji_to_kana']:['ja_to_zh','zh_to_ja',...(x.w!=x.r?['kanji_to_kana','kana_to_kanji']:[])],fr=modes.filter(m=>!it.m.includes(m)),
 ds=sh(A(t).filter(y=>y.i!=id&&y.l==x.l&&y.m!=x.m&&(kj||y.w!=x.w))).slice(0,3);const mode=pk(fr.length?fr:modes),qs=kj&&mode=='kanji_to_kana'&&x.q.length?(()=>{const o=x.q.filter(a=>a[3]!=it.lt);return pk(o.length?o:x.q)})():null;Q.cur={id,x,mode,q:qs,opts:sh([x,...ds]),done:0};quizView()}
function quizView(){const{t,cur}=Q,{x,mode,opts}=cur,kj=t=='k',jp=nm(t,x),tx=mode=='ja_to_zh'||mode=='zh_to_ja',lab=o=>mode=='ja_to_zh'?esc(o.m):esc(nm(t,o)),
 title={ja_to_zh:'日文選中文',zh_to_ja:'中文選日文',kanji_to_kana:'漢字輸入假名',kana_to_kanji:'假名輸入漢字'}[mode],
 prompt=cur.q?`<span class="m" style="font-size:56px">${esc(jp)}</span><div class="ex" style="margin-top:10px"><span class="sm">參考單字：請填入「${esc(jp)}」在這個詞裡的讀音</span><br><span class="m" style="font-size:26px">${esc(cur.q[0])}　${esc(cur.q[1])}</span> <span class="tag">${cur.q[3]=='on'?'音讀':'訓讀'}</span><br><span class="sm">${esc(cur.q[4])}</span></div>`:mode=='ja_to_zh'||mode=='kanji_to_kana'?`<span class="m" style="font-size:42px">${esc(jp)}</span>`:mode=='zh_to_ja'?`<span style="font-size:26px">${esc(x.m)}</span>`:`<span class="m" style="font-size:34px">${esc(x.r)}</span><br><span class="sm">${esc(x.m)}</span>`;
 $('#app').innerHTML=`<div class="c"><p class="sm">${t=='v'?'單字':'漢字'}${{today:'測驗',review:'複習',mist:'錯題測驗'}[Q.kind]}・${title}・剩 ${Q.queue.length+1} 題</p><p>${prompt}${mode=='kanji_to_kana'&&kj&&!cur.q?'<br><span class="sm">輸入任一音讀或訓讀（用平假名）</span>':''}</p>${tx?opts.map((o,i)=>`<button class="opt" onclick="pick(${i})">${lab(o)}</button>`).join(''):`<div class="row"><input id="ans" placeholder="輸入答案後按 Enter" onkeydown="if(event.key=='Enter')typed()" autocomplete="off"><button class="btn" onclick="typed()">送出</button></div>`}<div id="fb"></div><div class="row"><button class="btn o" onclick="go('${Q.kind=='mist'?'mist':'today'}')">結束測驗</button></div></div>`;$('#ans')?.focus()}
function fin(ok,right){const c=Q.cur;if(c.done)return;c.done=1;answer(Q.t,c.id,c.mode,ok,c.q&&c.q[3]);if(!Q.tried.has(c.id)){Q.tried.add(c.id);if(ok)Q.ok++}if(!ok)Q.queue.push(c.id);
 $('#fb').innerHTML=`<p style="color:var(${ok?'--g':'--r'})"><b>${ok?'答對了！':'答錯了'}</b>${ok?'':'　正確答案：'+esc(right)+'（稍後會再考一次）'}</p>${c.q?`<p class="sm">${esc(c.q[0])} ＝ ${esc(c.q[5])}　${esc(c.x.c)} 的音讀：${esc(c.x.on.join('、')||'—')}／訓讀：${esc(c.x.kun.join('、')||'—')}</p>`:''}<button class="btn" onclick="nextQ()">下一題</button>`;document.querySelectorAll('.opt').forEach(b=>b.disabled=true)}
function pick(i){const c=Q.cur;if(c.done)return;const ok=c.opts[i].i==c.id;fin(ok,c.mode=='ja_to_zh'?c.x.m:nm(Q.t,c.x));document.querySelectorAll('.opt').forEach((b,j)=>{if(c.opts[j].i==c.id)b.classList.add('ok');else if(j==i)b.classList.add('no')})}
function typed(){const c=Q.cur;if(c.done)return;const a=norm($('#ans').value),x=c.x;if(!a)return;let ok,right;
 if(c.q){ok=a==norm(c.q[2]);right=c.q[2]}else if(c.mode=='kanji_to_kana'){const rs=Q.t=='k'?[...x.on,...x.kun]:[x.r];ok=rs.some(r=>norm(r)==a);right=rs.join('、')}else{ok=a==norm(x.w);right=x.w}fin(ok,right)}
function endQuiz(){const q=Q;Q=null;$('#app').innerHTML=`<div class="c"><h2>測驗完成</h2><p class="big m">${q.ok}<span class="sm"> / ${q.total} 首次答對</span></p><p class="sm">答錯的題目已重考到答對為止，並收進錯題本。答對的項目會進入「短期記憶」，之後在不同題型再答對一次就會升為「長期記憶」。</p><button class="btn" onclick="go('today')">回到今日進度</button></div>`}
function renderList(){const kj=tab=='kanji',t=kj?'k':'v',q=F.q.trim().toLowerCase();
 const r=A(t).filter(x=>(F.l=='all'||x.l==F.l)&&(F.s=='all'||(F.s=='unseen'?!S[t][x.i]:S[t][x.i]?.s==F.s))&&(!q||[x.w,x.r,x.c,x.m,x.ro,(x.on||[]).join(),(x.kun||[]).join()].some(f=>f&&String(f).toLowerCase().includes(q)))),pc=Math.max(1,Math.ceil(r.length/PS));F.p=Math.min(F.p,pc);
 const pg=r.slice((F.p-1)*PS,F.p*PS),sel=(k,o)=>`<select onchange="F.${k}=this.value;F.p=1;renderList()">${o.map(([v,n])=>`<option value="${v}" ${F[k]==v?'selected':''}>${n}</option>`).join('')}</select>`;
 $('#app').innerHTML=`<p class="sm">這裡用來查看掌握狀況與查詢；要學習請到「今日進度」。</p><div class="row"><input id="q" placeholder="搜尋${kj?'漢字或中文':'日文、假名、羅馬字或中文'}" value="${esc(F.q)}" oninput="F.q=this.value;F.p=1;clearTimeout(F.tm);F.tm=setTimeout(()=>{renderList();const e=$('#q');e.focus();e.setSelectionRange(99,99)},250)">${sel('l',[['all','全部等級'],['N5','N5'],['N4','N4']])}${sel('s',[['all','全部狀態'],['unseen','未學習'],['learning','學習中'],['short','短期記憶'],['long','長期記憶']])}
 ${kj?'':`<button class="btn o" onclick="S.set.furi=!S.set.furi;save();renderList()">假名：${S.set.furi?'顯示':'隱藏'}</button>`}</div><p class="sm">${r.length} 筆符合</p>
 ${kj?`<div class="grid">${pg.map(x=>`<div class="k" onclick="show('k',${x.i})"><div class="m">${x.c}</div><div class="sm">${esc(x.m)}</div>${tag(S.k[x.i])}</div>`).join('')}</div>`
 :`<div class="c" style="padding:4px 12px">${pg.map(x=>`<div class="li" onclick="show('v',${x.i})"><span class="w m ${S.set.furi?'':'nofu'}">${x.w!=x.r?`<ruby>${esc(x.w)}<rt>${esc(x.r)}</rt></ruby>`:esc(x.w)}</span><span class="t">${esc(x.m)}<br><span class="sm">${esc(x.p)}</span></span><span class="tag">${x.l}</span>${tag(S.v[x.i])}</div>`).join('')||'<p class="sm">沒有符合的項目</p>'}</div>`}
 <div class="row" style="justify-content:center"><button class="btn o" ${F.p<=1?'disabled':''} onclick="F.p--;renderList()">上一頁</button><span class="sm">${F.p} / ${pc}</span><button class="btn o" ${F.p>=pc?'disabled':''} onclick="F.p++;renderList()">下一頁</button></div>`}
function show(t,i){const x=A(t)[i],it=S[t][i],d=$('#dlg');d.innerHTML=`<div class="row"><span class="tag">${x.l}</span>${tag(it)}${it?`<span class="sm">答對 ${it.c} 次・答錯 ${it.w} 次</span>`:''}</div>${head(t,x)}${info(t,x)}<div class="row" style="justify-content:flex-end"><button class="btn" onclick="$('#dlg').close()">關閉</button></div>`;d.showModal()}
function mist(){const row=(t)=>Object.entries(S[t]).filter(([,it])=>it.mk).map(([i,it])=>{const x=A(t)[i];return `<div class="li" style="cursor:default"><span class="w m">${esc(nm(t,x))}</span><span class="t">${esc(t=='k'?'':x.r+'　')}${esc(x.m)}</span><span class="tag">錯 ${it.w} 次</span></div>`}).join(''),nv=queue('v','mist').length,nk=queue('k','mist').length;
 $('#app').innerHTML=`<div class="c"><h2>錯題本</h2><p class="sm">測驗答錯會自動加入，之後答對就移出。</p><div class="row">${nv?`<button class="btn" onclick="startQuiz('v','mist')">測驗單字錯題（${nv}）</button>`:''}${nk?`<button class="btn" onclick="startQuiz('k','mist')">測驗漢字錯題（${nk}）</button>`:''}</div>${row('v')+row('k')||'<p class="sm">目前沒有錯題。</p>'}</div>`}
function set(){$('#app').innerHTML=`<div class="c"><h2>每日目標</h2><div class="row"><label>新單字 <input type="number" id="nv" min="0" max="100" value="${S.set.nv}" style="width:80px;flex:none"></label><label>新漢字 <input type="number" id="nk" min="0" max="50" value="${S.set.nk}" style="width:80px;flex:none"></label><label>複習 <input type="number" id="rv" min="0" max="200" value="${S.set.rv}" style="width:80px;flex:none"></label></div><button class="btn" onclick="saveSet()">儲存</button><p class="sm">儲存後立刻套用到今天；已學過的項目不會被移除。</p></div>
 <div class="c"><h2>備份進度</h2><p class="sm">進度只存在這個瀏覽器。換電腦或清除瀏覽資料前，請先匯出。</p><div class="row"><button class="btn o" onclick="exp()">匯出進度</button><label class="btn o">匯入進度<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="btn o" style="color:var(--r)" onclick="if(confirm('確定清除全部進度？無法復原'))resetAll()">清除全部進度</button></div></div>
 <div class="c sm">資料來源：OpenJLPT（CC BY-SA 4.0；含 JMdict、KANJIDIC2、Jonathan Waller 的 JLPT 清單、Tatoeba）。JLPT 官方未公布字表，等級為社群近似值。繁體中文為草稿，尚待校對。</div>`}
function saveSet(){const g=i=>Math.max(0,Math.floor(+$('#'+i).value)||0);S.set.nv=Math.min(100,g('nv'));S.set.nk=Math.min(50,g('nk'));S.set.rv=Math.min(200,g('rv'));goal().t={...S.set};save();toast('已儲存');set()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='nihongo-progress-'+today()+'.json';a.click()}
function imp(f){if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.v||!d.k||!d.set)throw new Error('檔案格式不正確');S=migrate(d);save();toast('匯入完成');render()}).catch(e=>toast('匯入失敗：'+e.message))}
function resetAll(){localStorage.removeItem(KEY);localStorage.removeItem('nihongo-daily-v1');location.reload()}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
